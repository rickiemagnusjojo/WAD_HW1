<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="res/css/styles.css">
    <script type="text/javascript" src="src/js/dropdown.js" defer></script>
    <title>Add post</title>
</head>

<body>

    <header class="header">
        <nav>
            <ul class="nav">
                <li><a href="index.html">Home</a></li>
            </ul>
        </nav>

        <div class="profile">
            <img class="logo" id="userLogo" src="res/images/me.png" alt="Profile picture">
            <div class="dropdownContent" id="dropdown">
                <p class="username">John Doe</p>
                <p class="email">john.doe@ut.ee</p>
                <a href="./login.html" id="logout">logout</a>
            </div>
        </div>    
    </header>

    <main>
        <section class="addPost-container">
            <h2>Add post</h2>
            
            <form action="index.html" method="post" enctype="multipart/form-data">
            <p class="postText">
                <label>Post<br>body</label>
                <textarea class="postTextArea" cols="31" rows="10" placeholder="textarea" required></textarea>
            </p>
            <p class="selectFile">
                <label>Select<br>file</label>
                <input type="file" class="postFile">
            </p>
                <button type="submit">Create post</button>
            </form>
        </section>
    </main>


</body>

</html>
